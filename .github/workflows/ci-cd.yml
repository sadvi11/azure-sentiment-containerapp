name: CI/CD to Azure Container Apps

# CI on every push/PR (train + test). CD (build image in ACR + deploy to
# Azure Container Apps) only on pushes to main, once tests pass.
on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege at the workflow level: id-token is what lets Azure verify
# this run's identity via OIDC, so no Azure credential is stored in GitHub.
permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: sentiment-rg
  LOCATION: canadacentral
  ACR_NAME: ${{ vars.ACR_NAME }}   # set as a repo variable, must be globally unique
  APP_NAME: sentiment-api

jobs:
  test:
    name: Train & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest httpx

      - name: Train model
        run: python -m app.train

      - name: Run tests
        run: pytest -q

  # The `secrets` context is not available in a job-level `if`, so this small
  # job reads it into an output instead. Without it, a repo that hasn't had its
  # Azure credentials configured yet fails the deploy job and shows a red badge
  # for what is really just "not set up on Azure".
  check-config:
    name: Check Azure config
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACR: ${{ vars.ACR_NAME }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$TENANT_ID" ] && \
             [ -n "$SUBSCRIPTION_ID" ] && [ -n "$ACR" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Azure OIDC identity configured - deploy will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "### Deploy skipped :construction:" >> "$GITHUB_STEP_SUMMARY"
            echo "Set \`AZURE_CLIENT_ID\`, \`AZURE_TENANT_ID\`," \
              "\`AZURE_SUBSCRIPTION_ID\` and the \`ACR_NAME\` variable" \
              "to enable deployment. See the README." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Build image & deploy to Azure
    runs-on: ubuntu-latest
    needs: [test, check-config]
    if: >-
      needs.check-config.outputs.configured == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC - no stored credential)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # A disabled subscription is a billing state, not a code defect. Without
      # this the pipeline goes red on a repository whose tests all pass, which
      # says "this project is broken" when the truth is "the free trial ended".
      #
      # This is NOT continue-on-error over a failing check. The deploy is
      # skipped only when the subscription is provably unwritable, the reason
      # is printed as a warning, and every step that tests the code still runs
      # and can still fail. Blanket-suppressing the deploy failure would hide
      # a real broken deploy the day billing is restored.
      - name: Check the subscription can still be written to
        id: sub
        run: |
          state=$(az account show --query state -o tsv 2>/dev/null || echo "UNKNOWN")
          if az group show --name "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1 \
             || az group list --only-show-errors >/dev/null 2>&1; then
            # A read succeeding does not prove writes work - a disabled
            # subscription is marked read-only, so probe an actual write.
            if az tag list --resource-id "/subscriptions/$(az account show --query id -o tsv)" \
                 --only-show-errors >/dev/null 2>&1; then
              echo "usable=true" >> "$GITHUB_OUTPUT"
            else
              echo "usable=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$(grep -c . <<<"${state}")" -gt 0 ] && [ "$state" != "Enabled" ]; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$(tail -1 "$GITHUB_OUTPUT")" = "usable=false" ]; then
            echo "::warning::Azure subscription is disabled or read-only (state: ${state}). Tests passed; the deploy is skipped because the target does not exist. Restore billing to redeploy - no code change is needed."
          fi

      - name: Ensure resource group and ACR exist
        if: steps.sub.outputs.usable == 'true'
        run: |
          # Creating a resource group needs subscription-level write. Skipping
          # it when the group already exists lets the pipeline run with a
          # credential scoped only to this resource group (least privilege).
          if az group show --name "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1; then
            echo "Resource group $RESOURCE_GROUP already exists."
          else
            az group create --name "$RESOURCE_GROUP" --location "$LOCATION" -o none
          fi
          # --admin-enabled false: nothing needs the admin account. CI pushes
          # with its own Azure login, and the container app pulls with its
          # managed identity. Creating with admin on would silently re-enable
          # it on every run.
          # -o none: the registry JSON embeds systemData.createdBy, which is the
          # email of whoever created it. On a public repo the Actions log is
          # world-readable, so printing it publishes that address.
          az acr create --resource-group "$RESOURCE_GROUP" \
            --name "$ACR_NAME" --sku Basic --admin-enabled false \
            --only-show-errors -o none

      - name: Build & push image to ACR
        if: steps.sub.outputs.usable == 'true'
        run: |
          # `az acr build` (cloud build via ACR Tasks) is the tidier option, but
          # ACR Tasks is not available on free/trial subscriptions - it fails
          # with TasksOperationsNotAllowed. Building on the runner works on any
          # subscription tier. Runners are x86, matching Container Apps.
          ACR_SERVER=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)
          az acr login --name "$ACR_NAME"
          docker build --platform linux/amd64 \
            -t "$ACR_SERVER/$APP_NAME:${{ github.sha }}" .
          docker push "$ACR_SERVER/$APP_NAME:${{ github.sha }}"

      - name: Deploy infrastructure + app (Bicep)
        if: steps.sub.outputs.usable == 'true'
        run: |
          # No registry credentials are fetched or passed: the container app
          # pulls using its own managed identity, which holds AcrPull on the
          # registry. The ACR admin account is disabled, so `az acr credential
          # show` would fail here by design.
          ACR_SERVER=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              appName="$APP_NAME" \
              containerImage="$ACR_SERVER/$APP_NAME:${{ github.sha }}" \
              acrLoginServer="$ACR_SERVER" \
            -o none

      - name: Show app URL
        if: steps.sub.outputs.usable == 'true'
        run: |
          FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Deployed: https://$FQDN"
          echo "### Deployed :rocket: https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
